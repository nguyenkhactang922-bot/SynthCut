name: Release

# Manual runs remain non-publishing package validation. A release tag is fail-closed:
# Remotion basis + Supabase entitlement backend + an explicitly approved publisher-trust
# lane must pass. The current commercial lane is intentionally unsigned; trusted signing
# remains available as optional future hardening.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ESIGNER_CKA_VERSION: "1.1.2"
  ESIGNER_CKA_INSTALLER_SHA256: "3f088403139505ddfb0ed3b56b72893f92c865f98b382753a1e1c695a5cece35"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Validate release identity, versions and source state
        run: node scripts/release/validate-release.mjs --require-clean

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify Remotion dependency closure packaging
        run: node scripts/release/smoke-remotion-dependency-packaging.cjs

      - name: Build core + MCP + renderer
        run: npm run build

      - name: Install pinned FFmpeg staging source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --version=6.1.1 --allow-downgrade -y --no-progress
          $tools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem $tools -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem $tools -Recurse -File -Filter ffprobe.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Pinned Chocolatey FFmpeg 6.1.1 executables not found' }
          "AIVE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AIVE_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore known workspace-bin mutation before provenance manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allowedPath = 'packages/skill-installer/bin/synthcut.mjs'
          $dirty = @(git status --porcelain=v1 --untracked-files=no)
          foreach ($line in $dirty) {
            if ($line.Length -lt 4 -or $line.Substring(3) -ne $allowedPath) {
              throw "Unexpected tracked mutation before provenance staging: $line"
            }
          }
          if ($dirty.Count -gt 1) { throw "Expected at most one known workspace-bin mutation before provenance staging, found $($dirty.Count)" }
          if ($dirty.Count -eq 1) {
            git restore --source=HEAD --worktree -- $allowedPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore known workspace-bin mutation before provenance staging: $allowedPath" }
          }
          $remaining = @(git status --porcelain=v1 --untracked-files=no)
          if ($remaining.Count -ne 0) { throw "Tracked worktree remains dirty before provenance staging: $($remaining -join '; ')" }
          'PRE_PROVENANCE_TRACKED_CLEAN_GATE=PASS' | Write-Output

      - name: Stage verified FFmpeg, Whisper, YuNet, font and provenance
        run: npm run prepare:bundle --workspace apps/desktop

      - name: Enforce commercial gates for release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' }}
        shell: pwsh
        env:
          REMOTION_COMMERCIAL_BASIS_APPROVED: ${{ vars.REMOTION_COMMERCIAL_BASIS_APPROVED }}
          SUPABASE_LICENSE_BACKEND_APPROVED: ${{ vars.SUPABASE_LICENSE_BACKEND_APPROVED }}
          UNSIGNED_COMMERCIAL_RELEASE_APPROVED: ${{ vars.UNSIGNED_COMMERCIAL_RELEASE_APPROVED }}
          WINDOWS_SIGNING_APPROVED: ${{ vars.WINDOWS_SIGNING_APPROVED }}
          WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
          WINDOWS_SIGN_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGN_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REMOTION_COMMERCIAL_BASIS_APPROVED -ne 'true') { throw 'REMOTION_COMMERCIAL_BASIS_APPROVED must be true before a release tag can build' }
          if ($env:SUPABASE_LICENSE_BACKEND_APPROVED -ne 'true') { throw 'SUPABASE_LICENSE_BACKEND_APPROVED must be true before a release tag can build' }
          if ($env:WINDOWS_SIGNING_APPROVED -eq 'true') {
            if ($env:WINDOWS_SIGNING_PROVIDER -ne 'sslcom-esigner') { throw 'Signed lane requires WINDOWS_SIGNING_PROVIDER=sslcom-esigner' }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PUBLISHER_NAME)) { throw 'Signed lane requires WINDOWS_SIGN_PUBLISHER_NAME' }
          } elseif ($env:UNSIGNED_COMMERCIAL_RELEASE_APPROVED -ne 'true') {
            throw 'Unsigned lane requires UNSIGNED_COMMERCIAL_RELEASE_APPROVED=true'
          }

      - name: Configure SSL.com eSigner CKA for optional trusted release signing
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.WINDOWS_SIGNING_APPROVED == 'true' && vars.WINDOWS_SIGNING_PROVIDER == 'sslcom-esigner' }}
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          WINDOWS_SIGN_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGN_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ESIGNER_USERNAME', 'ESIGNER_PASSWORD', 'ESIGNER_TOTP_SECRET', 'WINDOWS_SIGN_PUBLISHER_NAME')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing required signing input: $name" }
          }

          $installer = Join-Path $env:RUNNER_TEMP "SSL.COM.eSigner.CKA_$env:ESIGNER_CKA_VERSION.exe"
          $url = "https://github.com/SSLcom/eSignerCKA/releases/download/v$env:ESIGNER_CKA_VERSION/SSL.COM.eSigner.CKA_1.1.2_build_202600624.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:ESIGNER_CKA_INSTALLER_SHA256) {
            throw "eSigner CKA installer hash mismatch: $actualHash"
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'esigner-cka'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $proc = Start-Process -FilePath $installer -ArgumentList @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES',"/DIR=`"$installDir`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "eSigner CKA installer failed with exit code $($proc.ExitCode)" }

          $tool = Get-ChildItem $installDir -Recurse -File -Filter 'eSignerCKATool.exe' | Select-Object -First 1
          if (-not $tool) { throw 'eSignerCKATool.exe was not installed' }
          $masterKey = Join-Path $env:RUNNER_TEMP 'esigner-master.key'

          & $tool.FullName config -mode PROD -user $env:ESIGNER_USERNAME -pass $env:ESIGNER_PASSWORD -totp $env:ESIGNER_TOTP_SECRET -key $masterKey -r
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA config failed with exit code $LASTEXITCODE" }
          & $tool.FullName unload
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA unload failed with exit code $LASTEXITCODE" }
          & $tool.FullName load
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA load failed with exit code $LASTEXITCODE" }

          $nameType = [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName
          $matches = @(Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Where-Object {
            $_.HasPrivateKey -and $_.GetNameInfo($nameType, $false) -eq $env:WINDOWS_SIGN_PUBLISHER_NAME
          })
          if ($matches.Count -ne 1) { throw "Expected exactly one eSigner code-signing certificate for publisher '$env:WINDOWS_SIGN_PUBLISHER_NAME', found $($matches.Count)" }
          $cert = $matches[0]
          "WINDOWS_SIGN_CERT_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_SIGN_PUBLISHER_NAME=$env:WINDOWS_SIGN_PUBLISHER_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package unsigned Windows NSIS + ZIP for manual validation
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist --workspace apps/desktop

      - name: Package trusted-signed Windows NSIS + ZIP for signed release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.WINDOWS_SIGNING_APPROVED == 'true' && vars.WINDOWS_SIGNING_PROVIDER == 'sslcom-esigner' }}
        run: npm run dist:commercial --workspace apps/desktop

      - name: Package intentionally unsigned Windows NSIS + ZIP for current commercial lane
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.WINDOWS_SIGNING_APPROVED != 'true' && vars.UNSIGNED_COMMERCIAL_RELEASE_APPROVED == 'true' }}
        run: npm run dist --workspace apps/desktop

      - name: Verify packaged Electron core launch and health
        run: node scripts/release/smoke-packaged-core-launcher.cjs apps/desktop/build/dist/win-unpacked

      - name: Restore known workspace-bin mutation before post-package clean gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allowedPath = 'packages/skill-installer/bin/synthcut.mjs'
          $dirty = @(git status --porcelain=v1 --untracked-files=no)
          foreach ($line in $dirty) {
            if ($line.Length -lt 4 -or $line.Substring(3) -ne $allowedPath) {
              throw "Unexpected tracked mutation after packaging: $line"
            }
          }
          if ($dirty.Count -gt 1) { throw "Expected at most one known workspace-bin mutation, found $($dirty.Count)" }
          if ($dirty.Count -eq 1) {
            git restore --source=HEAD --worktree -- $allowedPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore known workspace-bin mutation: $allowedPath" }
          }
          $remaining = @(git status --porcelain=v1 --untracked-files=no)
          if ($remaining.Count -ne 0) { throw "Tracked worktree remains dirty after workspace-bin restore: $($remaining -join '; ')" }
          'POST_PACKAGE_TRACKED_CLEAN_GATE=PASS' | Write-Output

      - name: Assemble and validate release artifact set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'apps/desktop/build/dist'
          $out = 'apps/desktop/build/release-artifacts'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $requiredPatterns = @('*.exe', '*.exe.blockmap', 'latest.yml', '*.zip', 'SHA256SUMS.txt')
          foreach ($pattern in $requiredPatterns) {
            $matches = Get-ChildItem $src -File -Filter $pattern
            if (-not $matches) { throw "Missing required release artifact: $pattern" }
            $matches | Copy-Item -Destination $out -Force
          }

          Copy-Item 'apps/desktop/build/resources/aive/bundle-manifest.json' (Join-Path $out 'BUNDLE_MANIFEST.json') -Force
          Copy-Item 'LICENSE' (Join-Path $out 'LICENSE') -Force
          Copy-Item 'THIRD_PARTY_LICENSES.md' (Join-Path $out 'THIRD_PARTY_LICENSES.md') -Force
          Copy-Item 'release/compliance/SOURCE_OFFER.md' (Join-Path $out 'SOURCE_OFFER.md') -Force

          node scripts/release/validate-release.mjs --require-clean --metadata apps/desktop/build/release-artifacts/RELEASE_METADATA.json
          node scripts/release/validate-artifacts.mjs apps/desktop/build/release-artifacts

      - name: Verify trusted publisher, timestamp and Authenticode on signed release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.WINDOWS_SIGNING_APPROVED == 'true' && vars.WINDOWS_SIGNING_PROVIDER == 'sslcom-esigner' }}
        shell: pwsh
        env:
          WINDOWS_SIGN_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGN_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @()
          $targets += Get-ChildItem 'apps/desktop/build/release-artifacts' -File -Filter '*.exe'
          $appExe = Get-Item 'apps/desktop/build/dist/win-unpacked/Tang AI Video Editor.exe' -ErrorAction Stop
          $targets += $appExe
          if ($targets.Count -lt 2) { throw 'Expected installer and packaged application executable for signature verification' }

          $nameType = [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName
          foreach ($target in $targets) {
            $sig = Get-AuthenticodeSignature $target.FullName
            if ($sig.Status -ne 'Valid') { throw "Trusted signature verification failed for $($target.Name): $($sig.Status)" }
            if (-not $sig.SignerCertificate) { throw "Signer certificate missing for $($target.Name)" }
            $publisher = $sig.SignerCertificate.GetNameInfo($nameType, $false)
            if ($publisher -ne $env:WINDOWS_SIGN_PUBLISHER_NAME) { throw "Unexpected signer for $($target.Name): $publisher" }
            if (-not $sig.TimeStamperCertificate) { throw "RFC3161 timestamp missing for $($target.Name)" }
          }
          'WINDOWS_SIGNING_GATE=PASS' | Write-Output

      - name: Verify intentional NotSigned status for unsigned commercial release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.WINDOWS_SIGNING_APPROVED != 'true' && vars.UNSIGNED_COMMERCIAL_RELEASE_APPROVED == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @()
          $targets += Get-ChildItem 'apps/desktop/build/release-artifacts' -File -Filter '*.exe'
          $targets += Get-Item 'apps/desktop/build/dist/win-unpacked/Tang AI Video Editor.exe' -ErrorAction Stop
          if ($targets.Count -lt 2) { throw 'Expected installer and packaged application executable for unsigned-status verification' }
          foreach ($target in $targets) {
            $sig = Get-AuthenticodeSignature $target.FullName
            if ($sig.Status -ne 'NotSigned') { throw "Unsigned lane expected NotSigned for $($target.Name), got $($sig.Status)" }
          }
          @'
          IMPORTANT: This commercial Windows release is intentionally unsigned.
          Windows may display "Unknown publisher" and Microsoft Defender SmartScreen warnings.
          Supabase licensing controls product entitlement; it does not provide Authenticode publisher trust.
          '@ | Set-Content 'apps/desktop/build/release-artifacts/UNSIGNED_RELEASE_NOTICE.txt' -Encoding utf8
          'UNSIGNED_WINDOWS_RELEASE_GATE=PASS' | Write-Output

      - name: Upload validated non-publishing release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tang-ai-video-editor-windows
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  publish-release:
    needs: windows
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.REMOTION_COMMERCIAL_BASIS_APPROVED == 'true' && vars.SUPABASE_LICENSE_BACKEND_APPROVED == 'true' && vars.UNSIGNED_COMMERCIAL_RELEASE_APPROVED == 'true' && vars.WINDOWS_SIGNING_APPROVED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: tang-ai-video-editor-windows
          path: release-artifacts

      - name: Publish GitHub Release on the authorized fork only
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            **Windows publisher notice:** this commercial release is intentionally unsigned.
            Windows may display **Unknown publisher** and Microsoft Defender SmartScreen warnings during download/install.
            Supabase licensing controls Tang AI Video Editor entitlement; it does **not** provide Authenticode publisher trust.
