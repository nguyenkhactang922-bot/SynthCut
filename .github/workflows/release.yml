name: Release

# Manual runs are non-publishing package validation. A tag can publish only from
# the authorized personal fork and only after both external commercial gates are
# explicitly enabled. Build and publish permissions are intentionally separated.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Validate release identity, versions and source state
        run: node scripts/release/validate-release.mjs --require-clean

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build core + MCP + renderer
        run: npm run build

      - name: Install pinned FFmpeg staging source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --version=6.1.1 --allow-downgrade -y --no-progress
          $tools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem $tools -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem $tools -Recurse -File -Filter ffprobe.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Pinned Chocolatey FFmpeg 6.1.1 executables not found' }
          "AIVE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AIVE_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage verified FFmpeg, Whisper, YuNet, font and provenance
        run: npm run prepare:bundle --workspace synthcut-by-relo

      - name: Package Windows NSIS + ZIP without publishing
        run: npm run dist --workspace synthcut-by-relo -- --publish never

      - name: Assemble and validate release artifact set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'apps/desktop/build/dist'
          $out = 'apps/desktop/build/release-artifacts'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $requiredPatterns = @('*.exe', '*.exe.blockmap', 'latest.yml', '*.zip', 'SHA256SUMS.txt')
          foreach ($pattern in $requiredPatterns) {
            $matches = Get-ChildItem $src -File -Filter $pattern
            if (-not $matches) { throw "Missing required release artifact: $pattern" }
            $matches | Copy-Item -Destination $out -Force
          }

          Copy-Item 'apps/desktop/build/resources/aive/bundle-manifest.json' (Join-Path $out 'BUNDLE_MANIFEST.json') -Force
          Copy-Item 'LICENSE' (Join-Path $out 'LICENSE') -Force
          Copy-Item 'THIRD_PARTY_LICENSES.md' (Join-Path $out 'THIRD_PARTY_LICENSES.md') -Force
          Copy-Item 'release/compliance/SOURCE_OFFER.md' (Join-Path $out 'SOURCE_OFFER.md') -Force

          node scripts/release/validate-release.mjs --require-clean --metadata apps/desktop/build/release-artifacts/RELEASE_METADATA.json
          node scripts/release/validate-artifacts.mjs apps/desktop/build/release-artifacts

      - name: Verify trusted installer signature when commercial publication is enabled
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.REMOTION_COMMERCIAL_BASIS_APPROVED == 'true' && vars.WINDOWS_SIGNING_APPROVED == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = Get-ChildItem 'apps/desktop/build/release-artifacts' -File -Filter '*.exe'
          if (-not $installers) { throw 'No installer executable available for signature verification' }
          foreach ($installer in $installers) {
            $sig = Get-AuthenticodeSignature $installer.FullName
            if ($sig.Status -ne 'Valid') { throw "Trusted signature verification failed for $($installer.Name): $($sig.Status)" }
          }

      - name: Upload validated non-publishing release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tang-ai-video-editor-windows
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  publish-release:
    needs: windows
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'nguyenkhactang922-bot/SynthCut' && vars.REMOTION_COMMERCIAL_BASIS_APPROVED == 'true' && vars.WINDOWS_SIGNING_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: tang-ai-video-editor-windows
          path: release-artifacts

      - name: Publish GitHub Release on the authorized fork only
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          draft: false
          generate_release_notes: true
